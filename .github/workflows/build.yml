name: Build ChordMate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanitizers:
    # engine tests with AddressSanitizer + UndefinedBehaviorSanitizer (fast, no JUCE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and test the engine with sanitizers
        run: |
          cmake -B build -DCHORDMATE_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -Wall -Wextra"
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = "macos" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCHORDMATE_BUILD_PLUGIN_TESTS=ON
          fi

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test (engine, plus plugin smoke test on Windows)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Collect plugin bundles
        shell: bash
        run: |
          mkdir -p out
          find build -type d \( -name "ChordMate.vst3" -o -name "ChordMate.component" \) -prune -exec cp -R {} out/ \;
          cp LICENSE out/LICENSE.txt
          ls -la out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ChordMate-${{ matrix.name }}
          path: out

  release:
    # runs only when a version tag is pushed (e.g. v0.2.0)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, sanitizers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist

      - name: Create zip files
        run: |
          cd dist
          for d in ChordMate-*; do (cd "$d" && zip -qr "../$d-${GITHUB_REF_NAME}.zip" .); done
          ls -la

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*.zip
          generate_release_notes: true
