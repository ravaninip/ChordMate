name: Build ChordMate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configura
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = "macos" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCHORDMATE_BUILD_PLUGIN_TESTS=ON
          fi

      - name: Compila
        run: cmake --build build --config Release --parallel

      - name: Test (motore + prova del plugin su Windows)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Raccogli i plugin
        shell: bash
        run: |
          mkdir -p out
          find build -type d \( -name "ChordMate.vst3" -o -name "ChordMate.component" \) -prune -exec cp -R {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ChordMate-${{ matrix.name }}
          path: out

  release:
    # parte solo quando si pubblica un tag di versione (es. v0.2.0)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Crea gli zip
        run: |
          cd dist
          for d in ChordMate-*; do (cd "$d" && zip -qr "../$d-${GITHUB_REF_NAME}.zip" .); done
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
